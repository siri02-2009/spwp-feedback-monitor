<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parent Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4efff;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #6a0dad, #4169e1);
            color: white;
            padding: 22px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 30px;
        }

        .logout-btn {
            background: white;
            color: #6a0dad;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #eee;
        }

        /* Welcome Section */
        .welcome {
            text-align: center;
            padding: 30px 20px 20px;
        }

        .welcome h2 {
            color: #333;
            font-size: 28px;
        }

        .college-name {
            color: #6a0dad;
            font-size: 28px;
            font-weight: 900;
            margin-top: 10px;
        }

        /* Cards */
        .dashboard {
            width: 90%;
            max-width: 1100px;
            margin: 20px auto 40px;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .card {
            background: white;
            padding: 30px 20px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.12);
            cursor: pointer;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-7px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.18);
        }

        .card-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .card h3 {
            color: #6a0dad;
            font-size: 21px;
            margin-bottom: 10px;
        }

        .card p {
            color: #666;
            font-size: 14px;
        }

        /* Footer */
        footer {
            text-align: center;
            background: #6a0dad;
            color: white;
            padding: 15px;
            margin-top: 20px;
        }

        /* Mobile */
        @media (max-width: 800px) {
            .dashboard {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 18px;
            }

            .header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="header">
        <h1>Parent Dashboard</h1>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>
    </div>

    <!-- Welcome -->
    <div class="welcome">

        <h2>Welcome, Parent! 👨‍👩‍👧</h2>

        <p class="college-name">
            Sri Padmavathi Women's Polytechnic
        </p>

    </div>

    <!-- Dashboard Cards -->
    <div class="dashboard">
        
        <!-- Notices -->
        <div class="card" onclick="openNotices()">
            <div class="card-icon">📢</div>
            <h3>Notices</h3>
            <p>View college notices</p>
        </div>

        
        <!-- Contact details -->
        <div class="card" onclick="open contact details()">
            <div class="card-icon">🏫</div>
            <h3>Contact details</h3>
            <p>View contact details</p>
        </div>

    </div>

    <!-- Footer -->
    <footer>
        © 2026 Sri Padmavathi Women's Polytechnic
    </footer>


    <script>

        function openProfile() {
            window.location.href = "parent-profile.html";
        }

        function openAttendance() {
            window.location.href = "attendance.html";
        }

        function openMarks() {
            window.location.href = "marks.html";
        }

        function openNotices() {
            window.location.href = "notices.html";
        }

        function openTimetable() {
            window.location.href = "timetable.html";
        }

        function openContact() {
            alert("Please contact Sri Padmavathi Women's Polytechnic for more information.");
        }

        function openCollegeDetails() {
            window.location.href = "clg.html";
        }

        function logout() {
            window.location.href = "parent.html";
        }

    </script>

</body>
</html>
