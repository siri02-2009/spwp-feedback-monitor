
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - Notices Management</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f0ff, #d8e5ff, #eee5ff);
            padding-bottom: 40px;
        }

        /* HEADER */

        .header {
            background: linear-gradient(135deg, #087bea, #0645c9);
            color: white;
            padding: 22px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .header h1 {
            font-size: 28px;
        }

        .back-btn {
            text-decoration: none;
            color: #0645c9;
            background: white;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: bold;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #e8f0ff;
            transform: scale(1.05);
        }

        /* MAIN CONTAINER */

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 35px auto;
        }

        /* ADD NOTICE CARD */

        .notice-form {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            padding: 28px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            margin-bottom: 30px;
        }

        .notice-form h2 {
            color: #0645c9;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #333;
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #c5d4ee;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            background: white;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            border-color: #087bea;
            box-shadow: 0 0 5px rgba(8, 123, 234, 0.25);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .add-btn {
            background: linear-gradient(135deg, #087bea, #0645c9);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.2);
        }

        /* SEARCH */

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            outline: none;
            font-size: 15px;
        }

        /* NOTICE CARDS */

        .notice-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 22px;
            border-radius: 18px;
            margin-bottom: 18px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #087bea;
        }

        .notice-card h3 {
            color: #0645c9;
            margin-bottom: 8px;
        }

        .notice-card p {
            color: #444;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .date {
            color: #777;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .edit-btn {
            background: #ffc107;
            color: #222;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
        }

        .edit-btn:hover,
        .delete-btn:hover {
            opacity: 0.85;
        }

        /* EMPTY MESSAGE */

        .empty-message {
            text-align: center;
            padding: 30px;
            color: #777;
            font-size: 16px;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .container {
                width: 94%;
            }

            .header h1 {
                font-size: 23px;
            }

        }

    </style>

</head>

<body>

    <!-- HEADER -->

    <div class="header">

        <h1>📢 Notices Management</h1>

        <a href="admin-dashboard.html" class="back-btn">
            ← Back to Dashboard
        </a>

    </div>


    <!-- MAIN CONTAINER -->

    <div class="container">


        <!-- ADD NOTICE -->

        <div class="notice-form">

            <h2>➕ Add New Notice</h2>

            <div class="input-group">

                <label for="noticeTitle">
                    Notice Title
                </label>

                <input
                    type="text"
                    id="noticeTitle"
                    placeholder="Enter notice title"
                >

            </div>


            <div class="input-group">

                <label for="noticeDescription">
                    Notice Description
                </label>

                <textarea
                    id="noticeDescription"
                    placeholder="Enter notice details"
                ></textarea>

            </div>


            <div class="input-group">

                <label for="noticeDate">
                    Notice Date
                </label>

                <input
                    type="date"
                    id="noticeDate"
                >

            </div>


            <button class="add-btn" onclick="addNotice()">
                Add Notice
            </button>

        </div>


        <!-- SEARCH -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search notices..."
                onkeyup="searchNotices()"
            >

        </div>


        <!-- NOTICE LIST -->

        <div id="noticeList">

        </div>

    </div>


    <script>

        let notices = JSON.parse(localStorage.getItem("collegeNotices")) || [];


        /* DISPLAY NOTICES */

        function displayNotices(list = notices) {

            const noticeList = document.getElementById("noticeList");

            noticeList.innerHTML = "";


            if (list.length === 0) {

                noticeList.innerHTML =
                    '<div class="empty-message">No notices available.</div>';

                return;
            }


            list.forEach((notice, index) => {

                const card = document.createElement("div");

                card.className = "notice-card";

                card.innerHTML = `

                    <h3>${notice.title}</h3>

                    <p>${notice.description}</p>

                    <div class="date">
                        📅 Date: ${notice.date}
                    </div>

                    <div class="actions">

                        <button
                            class="edit-btn"
                            onclick="editNotice(${index})">
                            ✏️ Edit
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteNotice(${index})">
                            🗑️ Delete
                        </button>

                    </div>

                `;

                noticeList.appendChild(card);

            });

        }


        /* ADD NOTICE */

        function addNotice() {

            const title =
                document.getElementById("noticeTitle").value.trim();

            const description =
                document.getElementById("noticeDescription").value.trim();

            const date =
                document.getElementById("noticeDate").value;


            if (title === "" ||
                description === "" ||
                date === "") {

                alert("Please fill all the fields.");

                return;
            }


            const newNotice = {

                title: title,

                description: description,

                date: date

            };


            notices.unshift(newNotice);


            localStorage.setItem(
                "collegeNotices",
                JSON.stringify(notices)
            );


            document.getElementById("noticeTitle").value = "";

            document.getElementById("noticeDescription").value = "";

            document.getElementById("noticeDate").value = "";


            displayNotices();


            alert("Notice added successfully!");

        }


        /* DELETE NOTICE */

        function deleteNotice(index) {

            const confirmDelete =
                confirm("Are you sure you want to delete this notice?");


            if (confirmDelete) {

                notices.splice(index, 1);


                localStorage.setItem(
                    "collegeNotices",
                    JSON.stringify(notices)
                );


                displayNotices();

            }

        }


        /* EDIT NOTICE */

        function editNotice(index) {

            const notice = notices[index];


            const newTitle =
                prompt(
                    "Edit Notice Title:",
                    notice.title
                );


            if (newTitle === null ||
                newTitle.trim() === "") {

                return;
            }


            const newDescription =
                prompt(
                    "Edit Notice Description:",
                    notice.description
                );


            if (newDescription === null ||
                newDescription.trim() === "") {

                return;
            }


            const newDate =
                prompt(
                    "Edit Notice Date (YYYY-MM-DD):",
                    notice.date
                );


            if (newDate === null ||
                newDate.trim() === "") {

                return;
            }


            notices[index] = {

                title: newTitle.trim(),

                description: newDescription.trim(),

                date: newDate.trim()

            };


            localStorage.setItem(
                "collegeNotices",
                JSON.stringify(notices)
            );


            displayNotices();


            alert("Notice updated successfully!");

        }


        /* SEARCH NOTICES */

        function searchNotices() {

            const search =
                document
                .getElementById("searchInput")
                .value
                .toLowerCase();


            const filteredNotices =
                notices.filter(function(notice) {

                    return (

                        notice.title
                        .toLowerCase()
                        .includes(search)

                        ||

                        notice.description
                        .toLowerCase()
                        .includes(search)

                        ||

                        notice.date
                        .toLowerCase()
                        .includes(search)

                    );

                });


            displayNotices(filteredNotices);

        }


        /* INITIAL DISPLAY */

        displayNotices();

    </script>

</body>

</html>
