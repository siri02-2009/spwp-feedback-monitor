<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👩‍💼 HOD / Hostel Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #dbeafe, #e0e7ff);
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 40, 120, 0.18);
        }

        h2 {
            text-align: center;
            color: #1746a2;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        .password-container {
            position: relative;
            width: 100%;
        }

        .password-container input {
            padding-right: 75px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: auto;
            margin: 0;
            padding: 6px;
            background: transparent;
            color: #1746a2;
            font-size: 13px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .toggle-password:hover {
            opacity: 0.75;
        }

        .login-button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #087bea, #0645c9);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            opacity: 0.9;
        }

        .login-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            color: #c62828;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #1746a2;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="login-box">

        <h2>🔐 Staff Login</h2>
        <p class="subtitle">👩‍💼 HOD / 🏠 Hostel Admin</p>

        <form id="staffLoginForm">

            <label for="user_id">👤 User ID</label>
            <input
                type="text"
                id="user_id"
                name="user_id"
                placeholder="📝 Enter your User ID"
                autocomplete="username"
                required
            >

            <label for="password">🔑 Password</label>

            <div class="password-container">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="🔒 Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    id="togglePassword"
                    aria-label="Show password"
                    aria-pressed="false"
                >👁️ Show</button>
            </div>

            <button type="submit" class="login-button">
                🚀 Login
            </button>

            <p id="message" role="alert"></p>

        </form>

        <a class="back" href="/">🏠 ← Back to Home</a>

    </div>

    <script>
        // 👁️ Show or hide password
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        togglePassword.addEventListener("click", function () {
            const isHidden = passwordInput.type === "password";

            passwordInput.type = isHidden ? "text" : "password";
            togglePassword.textContent = isHidden ? "🙈 Hide" : "👁️ Show";

            togglePassword.setAttribute(
                "aria-label",
                isHidden ? "Hide password" : "Show password"
            );

            togglePassword.setAttribute(
                "aria-pressed",
                String(isHidden)
            );
        });

        // 🔐 Staff login
        document.getElementById("staffLoginForm").addEventListener(
            "submit",
            async function (event) {
                event.preventDefault();

                const message = document.getElementById("message");
                const loginButton = document.querySelector(".login-button");

                message.style.color = "#1746a2";
                message.textContent = "⏳ Checking your login details...";
                loginButton.disabled = true;

                try {
                    const response = await fetch("/api/staff-login", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            user_id: document.getElementById("user_id").value.trim(),
                            password: passwordInput.value
                        })
                    });

                    const data = await response.json();

                    if (response.ok && data.status === "success") {
                        message.style.color = "#15803d";
                        message.textContent = "✅ Login successful! Opening dashboard...";

                        window.location.href = data.redirect;
                    } else {
                        message.style.color = "#c62828";
                        message.textContent =
                            "❌ " + (data.message || "Invalid login details.");
                    }

                } catch (error) {
                    message.style.color = "#c62828";
                    message.textContent =
                        "⚠️ Unable to connect. Please try again.";
                } finally {
                    loginButton.disabled = false;
                }
            }
        );
    </script>
</body>
</html>
