<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sri Padmavathi Women's Polytechnic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* MAIN PAGE */
        .homepage {
            position: relative;
            width: 100vw;
            height: 100vh;
            /* COLLEGE PHOTO LINKED FROM SUBMITTED IMAGE */
            background-image: url("college-bg.jpg.png"); /* Temporary placeholder URL: Replace with your actual hosted image path if needed */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* LIGHT BLUE OVERLAY */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(190, 225, 250, 0.65);
            backdrop-filter: blur(3px);
        }

        /* MAIN CONTENT */
        .content {
            position: relative;
            z-index: 2;
            width: 90%;
            text-align: center;
            margin-top: -20px;
        }

        .welcome {
            color: #0645a5;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 7px;
            margin-bottom: 18px;
        }

        .college-name {
            color: #073f99;
            font-family: Georgia, serif;
            font-size: clamp(38px, 5vw, 75px);
            font-weight: bold;
            text-shadow: 2px 3px 5px rgba(255,255,255,0.8);
            margin-bottom: 5px;
        }

        .polytechnic {
            color: #0877dc;
            font-size: clamp(30px, 4vw, 55px);
            font-weight: bold;
            letter-spacing: 13px;
            margin-bottom: 20px;
        }

        .tagline {
            color: #0645a5;
            font-family: Georgia, serif;
            font-size: clamp(20px, 2vw, 30px);
            font-style: italic;
            margin-bottom: 45px;
            text-shadow: 1px 1px 3px white;
        }

        /* BUTTON AREA */
        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 35px;
            flex-wrap: wrap;
        }

        .main-btn {
            width: 400px;
            height: 105px;
            border-radius: 55px;
            border: none;
            background: linear-gradient(135deg, #087bea, #0645c9);
            color: white;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(0, 70, 180, 0.35);
            transition: 0.3s;
        }

        .main-btn:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 15px 30px rgba(0, 60, 180, 0.5);
        }

        .icon {
            font-size: 45px;
        }

        .arrow {
            font-size: 35px;
        }

        /* TOP LEFT DECORATION */
        .flower-left {
            position: absolute;
            top: -40px;
            left: -30px;
            font-size: 100px;
            transform: rotate(-25deg);
            opacity: 0.8;
            z-index: 3;
        }

        /* TOP RIGHT DECORATION */
        .flower-right {
            position: absolute;
            top: -40px;
            right: -20px;
            font-size: 90px;
            transform: rotate(25deg);
            opacity: 0.7;
            z-index: 3;
        }

        /* BOTTOM WAVE */
        .wave {
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 150px;
            background: rgba(35, 153, 230, 0.65);
            clip-path: polygon(0 35%, 10% 45%, 20% 65%, 30% 60%, 40% 45%, 50% 55%, 60% 80%, 70% 70%, 80% 55%, 90% 35%, 100% 25%, 100% 100%, 0 100%);
            z-index: 2;
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 800px) {
            .welcome {
                font-size: 16px;
                letter-spacing: 4px;
            }
            .polytechnic {
                letter-spacing: 7px;
            }
            .tagline {
                margin-bottom: 25px;
            }
            .buttons {
                gap: 15px;
            }
            .main-btn {
                width: 280px;
                height: 75px;
                font-size: 21px;
            }
            .icon {
                font-size: 30px;
            }
            .arrow {
                font-size: 25px;
            }
        }
    </style>
</head>
<body>

    <div class="homepage">
        <!-- LIGHT BLUE OVERLAY -->
        <div class="overlay"></div>

        <!-- DECORATIONS -->
        <div class="flower-left">🌿🌸</div>
        <div class="flower-right">🌿🌸</div>

        <!-- MAIN CONTENT -->
        <div class="content">
            <div class="welcome">WELCOME TO</div>
            <div class="college-name">Sri Padmavathi Women's</div>
            <div class="polytechnic">POLYTECHNIC</div>
            <div class="tagline">Empowering Women &nbsp; ✿ &nbsp; Building Futures</div>

            <!-- BUTTONS -->
            <div class="buttons">
                <a href="student.html" class="main-btn">
                    <span class="icon">🎓</span>
                    <span>Student</span>
                    <span class="arrow">→</span>
                </a>
                <a href="parent.html" class="main-btn">
                    <span class="icon">👨‍👩‍👧</span>
                    <span>Parent</span>
                    <span class="arrow">→</span>
                </a>
                              
<a href="/staff-login" class="main-btn">
    <span class="icon">👩‍💼</span>
    <span>HOD / Hostel Admin</span>
    <span class="arrow">→</span>
</a>

            </div>
        </div>

        <!-- BOTTOM DESIGN -->
        <div class="wave"></div>
    </div>

</body>
</html>
